<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Un detalle especial acompañado de flores amarillas"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">

    <title>Un detalle para ti</title>
</head>

<body>

    <!-- Elementos decorativos del fondo -->
    <div class="background" aria-hidden="true">
        <span class="light light--1"></span>
        <span class="light light--2"></span>
        <span class="light light--3"></span>
        <span class="light light--4"></span>
        <span class="light light--5"></span>
    </div>

    <!-- Contenido principal -->
    <main class="welcome">

        <section class="welcome__card">

            <p class="welcome__label">
                ✨ Un pequeño detalle especial para la niña mas hermosa✨
            </p>

            <h1 class="greetings" aria-label="¡Hola!">
                <span style="--delay: 0s">H</span>
                <span style="--delay: 0.1s">o</span>
                <span style="--delay: 0.2s">l</span>
                <span style="--delay: 0.3s">a</span>
                <span style="--delay: 0.4s">!</span>
            </h1>

            <div class="description">
                <span>Espero que ilumine tu día 💛</span>
            </div>

            <a class="button" href="flower.html">
                <span>Click aqui</span>
                <span class="button__icon" aria-hidden="true">🌻</span>
            </a>

        </section>

    </main>

</body>

</html>
