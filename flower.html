   <h1 class="message">
    Estas flores amarillas son un reflejo de la alegría que traes a mi vida.
    <span>Gracias por iluminar mis días con tu presencia.</span>
  </h1>

  <main class="generated-garden" id="garden" aria-label="Jardín animado de flores amarillas">
    <div class="generated-ground"></div>
  </main>

  <script>
    // Activa las animaciones aunque los scripts externos no estén disponibles.
    window.addEventListener("load", () => {
      document.body.classList.remove("not-loaded");
    });

    const garden = document.getElementById("garden");
    const amount = window.innerWidth <= 650 ? 18 : 32;

    function createFlower(index) {
      const flower = document.createElement("div");
      const x = (index / (amount - 1)) * 100 + (Math.random() * 2.4 - 1.2);
      const scale = 0.55 + Math.random() * 0.72;
      const delay = Math.random() * 1.7;
      const lean = -5 + Math.random() * 10;

      flower.className = "generated-flower";
      flower.style.setProperty("--x", `${x}%`);
      flower.style.setProperty("--size", scale.toFixed(2));
      flower.style.setProperty("--delay", `${delay.toFixed(2)}s`);
      flower.style.setProperty("--lean", `${lean.toFixed(1)}deg`);
      flower.style.zIndex = String(Math.round(scale * 10));

      flower.innerHTML = `
        <div class="generated-stem"></div>
        <div class="generated-leaf generated-leaf--left"></div>
        <div class="generated-leaf generated-leaf--right"></div>
        <div class="generated-bloom">
          ${'<i class="generated-petal"></i>'.repeat(8)}
          <i class="generated-center"></i>
        </div>`;

      garden.appendChild(flower);
    }

    function createSpark(index) {
      const spark = document.createElement("i");
      spark.className = "generated-spark";
      spark.style.left = `${3 + Math.random() * 94}%`;
      spark.style.bottom = `${8 + Math.random() * 35}%`;
      spark.style.setProperty("--delay", `${(index * .31).toFixed(2)}s`);
      garden.appendChild(spark);
    }

    for (let index = 0; index < amount; index += 1) createFlower(index);
    for (let index = 0; index < 24; index += 1) createSpark(index);
  </script>
